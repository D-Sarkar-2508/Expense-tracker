{% extends 'base.html' %}
{% block content %}

<div class="page-header">
    <h1>✏️ Edit Expense</h1>
    <p class="subtitle">Update your expense details</p>
</div>

<div class="card form-card">
    <form action="{{ url_for('edit_expense', id=expense.id) }}" method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label>Title *</label>
                <input type="text" name="title" value="{{ expense.title }}" required>
            </div>
            <div class="form-group">
                <label>Amount (₹) *</label>
                <input type="number" name="amount" step="0.01" min="0.01" value="{{ expense.amount }}" required>
            </div>
            <div class="form-group">
                <label>Category *</label>
                <select name="category" required>
                    {% for cat in categories %}
                        <option value="{{ cat }}" {% if cat == expense.category %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Date *</label>
                <input type="date" name="date" value="{{ expense.date.strftime('%Y-%m-%d') }}" required>
            </div>
            <div class="form-group full-width">
                <label>Note (optional)</label>
                <input type="text" name="note" value="{{ expense.note or '' }}" placeholder="Any extra detail...">
            </div>
        </div>
        <div style="display:flex; gap:1rem;">
            <button type="submit" class="btn btn-primary">💾 Save Changes</button>
            <a href="{{ url_for('index') }}" class="btn btn-cancel">✕ Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
